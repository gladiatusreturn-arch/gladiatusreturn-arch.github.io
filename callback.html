<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClipForge – login complete</title>
<style>body{max-width:720px;margin:40px auto;padding:0 20px;font:16px/1.6 system-ui,sans-serif;color:#222}
code{display:block;word-break:break-all;background:#f3f3f3;padding:12px;border-radius:8px;margin:12px 0}
button{font:inherit;padding:10px 16px;border-radius:8px;border:1px solid #888;background:#fff;cursor:pointer}</style>
</head>
<body>
<h1>Login complete</h1>
<p>Copy this page’s address and paste it into ClipForge, then close this tab.</p>
<code id="u"></code>
<button onclick="navigator.clipboard.writeText(location.href).then(()=>{this.textContent='Copied'})">Copy address</button>
<script>document.getElementById('u').textContent = location.href;</script>
</body>
</html>
